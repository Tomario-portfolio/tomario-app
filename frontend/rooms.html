<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客室一覧 - Tomario</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="logo">Tomario</a>
            <div id="nav-auth"></div>
        </nav>
    </header>
    <main>
        <div class="container">
            <a id="back-link" href="/hotels.html">&larr; ホテル一覧に戻る</a>
            <h2 id="hotel-heading">客室一覧</h2>
            <form class="search-form inline" id="search-form">
                <div class="form-group">
                    <label for="check_in">チェックイン</label>
                    <input type="date" id="check_in">
                </div>
                <div class="form-group">
                    <label for="check_out">チェックアウト</label>
                    <input type="date" id="check_out">
                </div>
                <button type="submit" class="btn">検索</button>
            </form>
            <p id="search-result" class="search-result"></p>
            <div id="rooms-grid" class="rooms-grid"></div>
        </div>
    </main>
    <footer><p>&copy; 2024 Tomario. All rights reserved.</p></footer>
    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
    <script>
        renderNav();

        const params = getParams();
        const hotelId = params.hotel_id;
        const checkIn = params.check_in || '';
        const checkOut = params.check_out || '';

        if (checkIn) document.getElementById('check_in').value = checkIn;
        if (checkOut) document.getElementById('check_out').value = checkOut;

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const ci = document.getElementById('check_in').value;
            const co = document.getElementById('check_out').value;
            window.location.href = `/rooms.html?hotel_id=${hotelId}&check_in=${ci}&check_out=${co}`;
        });

        (async () => {
            if (!hotelId) {
                window.location.href = '/hotels.html';
                return;
            }

            const hasDates = Boolean(checkIn && checkOut);
            const query = hasDates ? `?check_in=${checkIn}&check_out=${checkOut}` : '';
            const data = await apiRequest('GET', `/hotels/${hotelId}/room-types${query}`);
            document.getElementById('hotel-heading').textContent = `${data.hotel.name}の客室一覧`;
            document.title = `${data.hotel.name} - Tomario`;
            const grid = document.getElementById('rooms-grid');

            // 日付を指定したときは、空きのある部屋の種類だけを表示する
            const roomTypes = hasDates ? data.room_types.filter(t => t.available_rooms > 0) : data.room_types;
            if (hasDates) {
                document.getElementById('search-result').textContent =
                    `${checkIn} 〜 ${checkOut} の空き：${roomTypes.length}タイプ`;
            }

            if (roomTypes.length === 0) {
                grid.innerHTML = '<p>空き部屋がありません。</p>';
                return;
            }

            grid.innerHTML = roomTypes.map(t => `
                <div class="room-card">
                    <img src="${t.image_url || 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=600&q=80'}" alt="${t.room_type}" class="room-img">
                    <div class="room-info">
                        <h3>${t.room_type}</h3>
                        <p>定員：${t.capacity}名</p>
                        <p class="price">¥${t.price_per_night.toLocaleString()} / 泊</p>
                        <p>${hasDates ? `空き ${t.available_rooms}室` : `全${t.total_rooms}室`}</p>
                        <p>${t.description || ''}</p>
                        <a href="/room_detail.html?hotel_id=${hotelId}&room_type=${encodeURIComponent(t.room_type)}&check_in=${checkIn}&check_out=${checkOut}" class="btn">詳細を見る</a>
                    </div>
                </div>
            `).join('');
        })();
    </script>
</body>
</html>
