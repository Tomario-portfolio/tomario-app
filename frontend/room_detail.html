<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客室詳細 - Tomario</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/index.html" class="logo">Tomario</a>
            <div id="nav-auth"></div>
        </nav>
    </header>
    <main>
        <div class="container">
            <a id="back-link" href="/hotels.html">&larr; 客室一覧に戻る</a>
            <div id="room-detail" class="room-detail"></div>
        </div>
    </main>
    <footer><p>&copy; 2024 Tomario. All rights reserved.</p></footer>
    <script src="/js/api.js"></script>
    <script>
        renderNav();

        const params = getParams();
        const hotelId = params.hotel_id;
        const roomType = params.room_type;
        const checkIn = params.check_in || '';
        const checkOut = params.check_out || '';

        (async () => {
            const hasDates = Boolean(checkIn && checkOut);
            const query = hasDates ? `?check_in=${checkIn}&check_out=${checkOut}` : '';
            const data = await apiRequest('GET', `/hotels/${hotelId}/room-types${query}`);
            const room = data.room_types.find(t => t.room_type === roomType);

            document.getElementById('back-link').href =
                `/rooms.html?hotel_id=${hotelId}&check_in=${checkIn}&check_out=${checkOut}`;

            if (!room) {
                document.getElementById('room-detail').innerHTML = '<p>部屋が見つかりませんでした。</p>';
                return;
            }

            document.title = `${room.room_type} - ${data.hotel.name}`;
            document.getElementById('room-detail').innerHTML = `
                <img src="${room.image_url || 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=800&q=80'}" alt="${room.room_type}" class="room-detail-img">
                <p class="hotel-breadcrumb">${data.hotel.name}</p>
                <h2>${room.room_type}</h2>
                <table class="detail-table">
                    <tr><th>定員</th><td>${room.capacity}名</td></tr>
                    <tr><th>料金</th><td>¥${room.price_per_night.toLocaleString()} / 泊</td></tr>
                    <tr><th>空き</th><td>${hasDates ? `${room.available_rooms}室` : `全${room.total_rooms}室`}</td></tr>
                    <tr><th>説明</th><td>${room.description || '-'}</td></tr>
                </table>
                <a href="/booking.html?hotel_id=${hotelId}&room_type=${encodeURIComponent(room.room_type)}&check_in=${checkIn}&check_out=${checkOut}" class="btn">この部屋を予約する</a>
            `;
        })();
    </script>
</body>
</html>
