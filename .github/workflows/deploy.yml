name: Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: tomario-app

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # タグが既に存在する場合（リトライ時など）はビルドをスキップ
          if aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --region $AWS_REGION > /dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build."
          else
            # ECSタスクをARM64(Graviton)で動かすため、arm64単一アーキで直接ECRへpushする
            docker buildx build \
              --platform linux/arm64 \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              --push .
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

          DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ${{ matrix.env }}
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if ECS service exists
        id: check-service
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster tomario-${{ matrix.env }}-cluster \
            --services tomario-${{ matrix.env }}-service \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "tomario-${{ matrix.env }}-service is not ACTIVE (status: $STATUS). cost-stop中の可能性があるためデプロイをスキップします。"
          fi

      - name: Download current task definition
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition tomario-${{ matrix.env }}-task \
            --query taskDefinition \
            --output json > task-def.json

      - name: Update image in task definition
        if: steps.check-service.outputs.exists == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: tomario-app
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS
        if: steps.check-service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: tomario-${{ matrix.env }}-service
          cluster: tomario-${{ matrix.env }}-cluster
          wait-for-service-stability: true

  promote-to-production:
    name: Promote to Production
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    # GitHub Environment「prod」のRequired reviewersにより、ここで承認待ちになる
    environment: prod
    env:
      NONPROD_REGISTRY_ID: "418295697340"
      NONPROD_ECR_REPOSITORY: tomario-app
      PROD_ECR_REPOSITORY: tomario-production-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR (nonprod, source)
        id: login-ecr-nonprod
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.NONPROD_REGISTRY_ID }}

      - name: Login to ECR (production, destination)
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull staging-verified image by digest, re-tag, push (no rebuild)
        id: promote
        run: |
          SRC_IMAGE="${{ steps.login-ecr-nonprod.outputs.registry }}/${{ env.NONPROD_ECR_REPOSITORY }}@${{ needs.build-and-push.outputs.digest }}"
          DST_IMAGE="${{ steps.login-ecr-prod.outputs.registry }}/${{ env.PROD_ECR_REPOSITORY }}:${{ github.sha }}"

          # イメージはGraviton(ARM64)向けにビルドされておりamd64版が無いため、
          # amd64ランナーのデフォルトpull(amd64を探しに行く)だと失敗する。明示的にarm64を指定する
          # （production ECSタスクもruntime_platform=ARM64のため、そのまま使える）
          docker pull --platform linux/arm64 "$SRC_IMAGE"
          docker tag "$SRC_IMAGE" "$DST_IMAGE"
          docker push "$DST_IMAGE"

          echo "image=$DST_IMAGE" >> $GITHUB_OUTPUT

      - name: Check if production ECS service exists
        id: check-service
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster tomario-production-cluster \
            --services tomario-production-service \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "tomario-production-service is not ACTIVE (status: $STATUS). cost-stop中の可能性があるためデプロイをスキップします。"
          fi

      - name: Download current production task definition
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition tomario-production-task \
            --query taskDefinition \
            --output json > task-def.json

      - name: Update image in task definition
        if: steps.check-service.outputs.exists == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: tomario-app
          image: ${{ steps.promote.outputs.image }}

      - name: Deploy to ECS (production)
        if: steps.check-service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: tomario-production-service
          cluster: tomario-production-cluster
          wait-for-service-stability: true

      - name: Sync frontend to S3 (production)
        run: |
          aws s3 sync frontend/ s3://tomario-production-frontend/ --delete

      - name: Invalidate CloudFront cache (production)
        run: |
          aws cloudfront create-invalidation --distribution-id E16RCKYF5065BQ --paths "/*"

  deploy-frontend:
    name: Deploy Frontend to ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            distribution_id: E31X0ZOPLPLQUU
          - env: staging
            distribution_id: E1XHUK5RP1RUM8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # cost-stop中でも実行して問題ない（S3/CloudFrontはcost-stopの対象外で常に存在するため）
      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://tomario-${{ matrix.env }}-frontend/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ matrix.distribution_id }} --paths "/*"
