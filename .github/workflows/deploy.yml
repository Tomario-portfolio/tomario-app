name: Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: tomario-app

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # タグが既に存在する場合（リトライ時など）はビルドをスキップ
          if aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --region $AWS_REGION > /dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build."
          else
            # ECSタスクをARM64(Graviton)で動かすため、arm64単一アーキで直接ECRへpushする
            docker buildx build \
              --platform linux/arm64 \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              --push .
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ${{ matrix.env }}
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if ECS service exists
        id: check-service
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster tomario-${{ matrix.env }}-cluster \
            --services tomario-${{ matrix.env }}-service \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "tomario-${{ matrix.env }}-service is not ACTIVE (status: $STATUS). cost-stop中の可能性があるためデプロイをスキップします。"
          fi

      - name: Download current task definition
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition tomario-${{ matrix.env }}-task \
            --query taskDefinition \
            --output json > task-def.json

      - name: Update image in task definition
        if: steps.check-service.outputs.exists == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: tomario-app
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS
        if: steps.check-service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: tomario-${{ matrix.env }}-service
          cluster: tomario-${{ matrix.env }}-cluster
          wait-for-service-stability: true
